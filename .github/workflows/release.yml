name: Build & Deploy WP Plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. 1.0.17)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build assets
        run: npm run build

      - name: Build vendor dependencies
        env:
          COMPOSER_AUTH: ""
        run: composer run build

      - name: Build package
        run: npm run build:package

      # 🔥 Extract version (support v1.0.0 or 1.0.0)
      - name: Extract version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      # 🔥 Validate version + structure
      - name: Validate version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          echo "Validating version: $VERSION"

          # check semver
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            exit 1
          fi

          unzip giftflow.zip -d build

          # check plugin file
          if [ ! -f "build/giftflow/giftflow.php" ]; then
            echo "❌ Plugin main file not found!"
            exit 1
          fi

          # check plugin version
          FILE_VERSION=$(grep -i "Version:" build/giftflow/giftflow.php | head -1 | awk -F': ' '{print $2}' | tr -d '\r')
          echo "Plugin version: $FILE_VERSION"

          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "Tag: $VERSION"
            echo "Plugin: $FILE_VERSION"
            exit 1
          fi

          # check readme stable tag (optional but recommended)
          if [ -f "build/giftflow/readme.txt" ]; then
            README_VERSION=$(grep -i "Stable tag:" build/giftflow/readme.txt | awk -F': ' '{print $2}' | tr -d '\r')
            echo "Readme stable tag: $README_VERSION"

            if [ "$README_VERSION" != "$VERSION" ]; then
              echo "❌ Stable tag mismatch!"
              exit 1
            fi
          fi

          echo "✅ Validation passed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: giftflow.zip
          generate_release_notes: true

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: giftflow
          BUILD_DIR: build/giftflow

      